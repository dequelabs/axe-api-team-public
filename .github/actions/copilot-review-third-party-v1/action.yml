name: 'Copilot review for third-party PRs'
description: 'Drafts third-party PRs without a signed CLA, and requests a Copilot review on signed ones'

inputs:
  github-token:
    description: 'The workflow GITHUB_TOKEN. Reads the PR, reads statuses, converts to draft, and posts comments.'
    required: true
  copilot-token:
    description: 'A token for the company Copilot account. Requests the Copilot review and checks org membership.'
    required: true
  cla-context:
    description: 'The commit status context that reports the CLA.'
    default: 'license/cla'
  cla-wait-seconds:
    description: 'How long to wait for the CLA status to appear.'
    default: '120'
  review-wait-seconds:
    description: 'How long to wait for the Copilot review.'
    default: '900'

runs:
  using: 'node24'
  main: 'dist/index.js'
